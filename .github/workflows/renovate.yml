name: Renovate

on:
  push:
    paths:
      - ".github/workflows/renovate.yml"
      - ".github/config.json"
      - ".github/renovate.json"
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/renovate.yml"
      - ".github/config.json"
      - ".github/renovate.json"
    branches:
      - main
  schedule:
    - cron: "42 * * * *" # every hour at minute 42
  # Trigger manually via the GitHub UI
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOT_IMAGE_VERSION: '44'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Renovate configuration
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace "ghcr.io/renovatebot/renovate:$BOT_IMAGE_VERSION" renovate-config-validator .github/config.json
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace "ghcr.io/renovatebot/renovate:$BOT_IMAGE_VERSION" renovate-config-validator --no-global .github/renovate.json

  renovate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            repo-ops
            infra
            kradio
            ansible-role-docker-compose-homestack
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@1cd96b855fee0da6f230617e89dbff0e06ea393a # v46.3.5
        with:
          configurationFile: .github/config.json
          renovate-version: ${{ env.BOT_IMAGE_VERSION }}
          token: ${{ steps.app-token.outputs.token }}
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL)$"
        env:
          LOG_LEVEL: ${{ vars.RENOVATE_DEBUG_LEVEL }}
